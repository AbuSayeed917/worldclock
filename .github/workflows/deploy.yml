name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by actions/deploy-pages: it authenticates to Pages with a short-lived
  # OIDC token rather than a stored secret.
  id-token: write

# Never let two deploys run at once. `cancel-in-progress: false` matters here —
# cancelling a half-finished deploy can leave the Pages site in a broken state,
# so queued runs wait their turn instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # `npm run build` runs tsc --noEmit before vite build, so a type error
      # fails the deploy rather than shipping.
      - name: Build
        run: npm run build

      - name: Verify the built bundle references the Pages base path
        run: |
          if ! grep -q '/worldclock/assets/' dist/index.html; then
            echo "::error::dist/index.html does not reference /worldclock/assets/."
            echo "The Vite base path is wrong; the deployed site would 404 its own CSS and JS."
            exit 1
          fi
          test -f dist/lottie/dawn.json || { echo "::error::Lottie assets missing from dist"; exit 1; }
          echo "Base path and assets verified."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
